[project]
name = "python-template"
version = "0.1.0"
description = "Copier template for production-ready Python projects"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "copier>=9.19.1",
    "invoke>=3.0.3",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Rendering uncommitted template changes is the point of the tests.
filterwarnings = ["ignore:Dirty template changes"]

[tool.ruff]
extend-exclude = ["template"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]

[tool.mypy]
strict = true
files = ["tests", "tasks.py"]

[[tool.mypy.overrides]]
module = ["copier"]
ignore_missing_imports = true
