name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run invoke lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run invoke test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
      - run: uvx pre-commit run gitleaks --all-files

  # Runs the checks that need Docker or Node inside each generated variant,
  # the same way the generated project's own CI would.
  generated:
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        api: [false, true]
    name: generated (api=${{ matrix.api }})
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
      - uses: actions/setup-node@v7
        if: matrix.api
        with:
          node-version: lts/*
      - run: uv sync --locked
      - run: uv run invoke render --dest "$RUNNER_TEMP/demo" ${{ matrix.api && '--api' || '' }}
      - working-directory: ${{ runner.temp }}/demo
        run: |
          uv sync --locked
          uv run invoke audit
          uv run invoke smoke
      - if: matrix.api
        working-directory: ${{ runner.temp }}/demo
        run: uv run invoke api-test
